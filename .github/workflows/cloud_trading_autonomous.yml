name: Autonomous Cloud Quant Trader

on:
  workflow_dispatch:
# schedule:
  #   - cron: '*/20 * * * *'

jobs:
  cloud-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code & Models
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas-ta ccxt==4.3.33 python-dotenv pyupbit==0.2.34 pandas numpy stable-baselines3==2.6.0 gymnasium pyjwt requests

      - name: Run Cloud Trader Cycle
        env:
          UPBIT_ACCESS_KEY: ${{ secrets.UPBIT_ACCESS_KEY }}
          UPBIT_SECRET_KEY: ${{ secrets.UPBIT_SECRET_KEY }}
          LIVE_TRADING: "true"
        run: |
          python cloud_trader_cycle.py
